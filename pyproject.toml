[project]
name = "sentinelpay"
version = "0.4.0"
description = "Authorization and policy-enforcement layer for autonomous AI-agent payments on Algorand and x402"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "py-algorand-sdk>=2.5.0",
    "pyteal>=0.27.0",
    "langsmith>=0.11.0",
]

# Single source of dev dependencies. There used to be a second, differently
# pinned `[project.optional-dependencies] dev` block; uv resolved this group and
# pip resolved the other, so the two toolchains installed different pytest
# versions from the same file.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinelpay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "contracts/tests"]
python_files = "test_*.py"
filterwarnings = [
    # An unconfigured VERIFIER_PRIVATE_KEY is expected in the offline test
    # suite; sentinelpay/keys.py warns about it deliberately.
    "ignore:VERIFIER_PRIVATE_KEY is not set:RuntimeWarning",
]
